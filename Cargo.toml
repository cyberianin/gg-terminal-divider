[package]
name = "gg-format"
version = "1.1.1"
edition = "2021"
description = "Shared box and TSV formatting core for GG"
license = "MIT"

[dependencies]
unicode-width = "0.2.2"
unicode-segmentation = "1.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
